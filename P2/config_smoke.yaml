experiment:
  name: smoke_test
  seed: 42
  total_timesteps: 20000
  device: auto
environment:
  id: ALE/SpaceInvaders-v5
  num_envs: 2
  frame_skip: 4
  frame_stack: 4
  screen_size: 84
  repeat_action_probability: 0.25
  terminal_on_life_loss_train: true
  clip_reward_train: true
  full_action_space: false
algorithm:
  learning_rate: 0.00005
  buffer_size: 10000
  learning_starts: 5000
  batch_size: 32
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  n_steps: 3
  target_update_interval: 5000
  exploration_fraction: 0.20
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  n_quantiles: 50
  max_grad_norm: 10.0
  optimize_memory_usage: false
evaluation:
  frequency: 10000
  episodes: 2
  max_steps_per_episode: 10000
  deterministic: true
checkpoint:
  frequency: 10000
  save_replay_buffer: false

